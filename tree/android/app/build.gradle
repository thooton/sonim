plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

apply from: rootProject.file("gradle/bundled.gradle")

// The same command center as Tablet and Authenticator, with the same token:
// it runs the nightly QA.
bundled("com.tree.xp3") {
    def center = deltaCenter(true)
    [SERVER: center.server, TOKEN: center.token, REVISION: center.revision]
}

android {
    namespace "com.tree.xp3"

    defaultConfig {
        applicationId "com.tree.xp3"
        versionCode 4
        versionName "1.0.3"
    }
}

dependencies {
    implementation project(":tree:core")
    implementation project(":common:ui")
}
