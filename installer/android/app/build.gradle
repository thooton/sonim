plugins {
    id "com.android.application"
}

// No dependencies at all: two activities and a device-admin receiver.
android {
    namespace "com.installer.xp3"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.installer.xp3"
        minSdk 27
        targetSdk 27
        versionCode 1
        versionName "1.0.0"
    }

    // Targets the XP3's own Android 8.1 on purpose; this is not for Play.
    lint {
        disable "ExpiredTargetSdkVersion"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Signed with the shared key, which is also how InstallActivity recognises
// the apps it will install for.
apply from: rootProject.file("../../signing/signing.gradle")
