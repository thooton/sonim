plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

// The shared signing key is also what lets it hand APKs to Installer, whose
// install permission is signature-only.

android {
    namespace "com.updater.xp3"

    defaultConfig {
        applicationId "com.updater.xp3"
        versionCode 3
        versionName "1.1.0"
    }
}

dependencies {
    implementation project(":updater:core")
    implementation project(":common:ui")
}
