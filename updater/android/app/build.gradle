plugins {
    id "com.android.application"
}

// One dependency, and it is the other half of this app. Nothing third party:
// no AndroidX, no Material components, no HTTP library. :core is the
// Android-free half (versions, the release's files, downloading), plain Java so
// it can be tested on a desktop JVM.
dependencies {
    implementation project(":core")
}

android {
    namespace "com.updater.xp3"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.updater.xp3"
        minSdk 27
        targetSdk 27
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // API 27 is the phone's own version; this app is never going to Play.
    lint {
        disable "ExpiredTargetSdkVersion"
    }
}

// Signed with the shared key, like every app in this repository. That is also
// what lets it hand APKs to Installer, whose install permission is
// signature-only.
apply from: rootProject.file("../../signing/signing.gradle")
