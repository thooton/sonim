plugins {
    id "java-library"
}

// No dependencies block. The core is the half of the app that has to be plain
// Java, so the FSRS state machine, the deck model and the 85%-targeted group
// builder can be run and checked on a desktop JVM without a phone.
//
// `release = 8` keeps the port honest: everything here also has to run
// unchanged on Android at API 27, and the compiler is the only thing that
// reliably notices when code reaches for an API the phone does not have.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 8
}

// The plain Java test runner, kept for the same reason as the Todo app: a test
// framework would be the first third-party dependency in a tree that has none.
tasks.register("selfTest", JavaExec) {
    dependsOn "testClasses"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.flashcards.xp3.SelfTest"
}
tasks.named("check") { dependsOn "selfTest" }
tasks.named("test") {
    dependsOn "selfTest"
    enabled = false
}
