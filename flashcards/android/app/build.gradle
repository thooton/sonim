plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

apply from: rootProject.file("gradle/bundled.gradle")

// The same command center as Authenticator, with the same token: it keeps
// the decks and syncs them with the tablet.
bundled("com.flashcards.xp3") {
    def center = deltaCenter(false)
    [SERVER: center.server, TOKEN: center.token, REVISION: center.revision]
}

android {
    namespace "com.flashcards.xp3"

    defaultConfig {
        applicationId "com.flashcards.xp3"
        versionCode 19
        versionName "1.9.3"
    }
}

dependencies {
    implementation project(":flashcards:core")
    implementation project(":common:ui")
}
