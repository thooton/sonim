plugins {
    id "com.android.application"
}

// One dependency, and it is the other half of this repository. Nothing third
// party: no AndroidX, no Material components. Everything this module draws is
// a View from android.widget. That is what keeps a debug APK for a 240x320
// phone small and dependency-free, just like the Todo and Tesla apps that
// share this build style.
dependencies {
    implementation project(":core")
}

android {
    // The repository's shared debug key (signing/debug.keystore), so a build
    // from any checkout or from CI installs over any other.
    signingConfigs {
        debug {
            storeFile rootProject.file("../../signing/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    namespace "com.flashcards.xp3"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.flashcards.xp3"
        minSdk 27
        targetSdk 27
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
