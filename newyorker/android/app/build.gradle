plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

android {
    namespace "com.newyorker.xp3"

    defaultConfig {
        applicationId "com.newyorker.xp3"
        versionCode 11
        versionName "1.2.4"
    }

    // The fonts are already compressed glyph outlines; leaving them stored
    // lets Typeface map them straight from the APK.
    androidResources {
        noCompress "ttf"
    }
}

dependencies {
    implementation project(":newyorker:core")
    implementation project(":common:ui")
}
