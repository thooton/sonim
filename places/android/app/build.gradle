plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

apply from: rootProject.file("gradle/bundled.gradle")

// The same command center as Delta, with the same token: it keeps the Google
// Maps key.
bundled("com.places.xp3") {
    def center = deltaCenter(true)
    [SERVER: center.server, TOKEN: center.token, REVISION: center.revision]
}

android {
    namespace "com.places.xp3"

    defaultConfig {
        applicationId "com.places.xp3"
        versionCode 13
        versionName "1.4.4"
    }
}

dependencies {
    implementation project(":places:core")
    implementation project(":common:ui")
}
