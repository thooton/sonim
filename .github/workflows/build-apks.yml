name: Build APKs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.1

jobs:
  gradle:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: canvas
            dir: canvas/android
          - app: charge
            dir: charge/android
          - app: delta
            dir: delta/android
            selftest: true
          - app: dictionary
            dir: dictionary
          - app: flashcards
            dir: flashcards/android
          - app: installer
            dir: installer/android
          - app: list
            dir: list/android
          - app: source
            dir: source/android
            selftest: true
          - app: updater
            dir: updater/android
            selftest: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - uses: gradle/actions/setup-gradle@v4

      # Charge refuses to build without android/.tokens.json. CI never bakes a
      # real Tesla credential into a downloadable artifact, so it gets a
      # placeholder: the APK builds, but has no working login.
      - name: Placeholder Charge token
        if: matrix.app == 'charge'
        run: echo '{"refreshToken":"ci-placeholder"}' > charge/android/.tokens.json

      # Delta, Source and the Updater keep their protocol and parsing code in
      # a plain Java :core with its own runner. CI has no logins, so the APKs
      # it builds carry none.
      - name: Self-test
        if: matrix.selftest
        working-directory: ${{ matrix.dir }}
        run: ./gradlew --no-daemon :core:selfTest

      # Release builds are signed with the shared key in signing/, the same
      # one the copies on the phone carry, so they install over them.
      - name: Build release APK
        working-directory: ${{ matrix.dir }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp ${{ matrix.dir }}/app/build/outputs/apk/release/app-release.apk out/${{ matrix.app }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: out/*.apk
          if-no-files-found: error

  launcher:
    name: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      # build.sh calls `aapt` from PATH and signs with launcher/signing/.
      - name: Build AppDrawer APK
        run: |
          export PATH="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS:$PATH"
          ./launcher/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/AppDrawer.apk
          if-no-files-found: error

  bundle:
    name: All APKs
    needs: [gradle, launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-apk'
          path: apks
          merge-multiple: true

      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      # What the Updater app reads: each APK's version and package, keyed by
      # its file name without .apk (which is also its name in the release).
      # Both come from the built APKs themselves, so they can't drift from
      # the build files.
      - name: List versions and packages
        run: |
          aapt2="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          : > apks/versions.txt
          : > apks/packages.txt
          for apk in apks/*.apk; do
            app=$(basename "$apk" .apk)
            badging=$("$aapt2" dump badging "$apk" | head -n 1)
            version=$(printf '%s\n' "$badging" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
            package=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            if [ -z "$version" ] || [ -z "$package" ]; then
              echo "No version or package in $apk: $badging" >&2
              exit 1
            fi
            echo "$app = $version" >> apks/versions.txt
            echo "$app = $package" >> apks/packages.txt
          done
          cat apks/versions.txt apks/packages.txt

      - uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            apks/*.apk
            apks/versions.txt
            apks/packages.txt
          if-no-files-found: error

      # Pushes to master also publish the APKs to the rolling "latest" release.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          cat > notes.md <<'EOF'
          Built automatically from master. Download the APK for the app you want and install it with `adb install <file>.apk`, or let the Updater app on the phone do it.

          `versions.txt` lists each app's latest version and `packages.txt` its package name; the Updater reads both.
          EOF
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Sonim apps (latest)" --notes-file notes.md
          gh release edit latest --notes-file notes.md
          gh release upload latest apks/*.apk apks/versions.txt apks/packages.txt --clobber
          # Drop assets no build produces any more, such as the old
          # *-debug.apk files.
          gh release view latest --json assets -q '.assets[].name' | while read -r name; do
            [ -f "apks/$name" ] || gh release delete-asset latest "$name" -y
          done
