name: Build APKs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_BUILD_TOOLS: 35.0.1

jobs:
  build:
    name: All APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - uses: gradle/actions/setup-gradle@v4

      # Charge refuses to build without android/.tokens.json. CI never bakes a
      # real Tesla credential into a downloadable artifact, so it gets a
      # placeholder: the APK builds, but has no working login. CI has no other
      # logins either, so the APKs it builds carry none.
      - name: Placeholder Charge token
        run: echo '{"refreshToken":"ci-placeholder"}' > charge/android/.tokens.json

      # Every app is one Gradle build (settings.gradle finds them), so this
      # runs every :core's self-test and builds every release APK, signed with
      # the shared key in signing/ like the copies on the phone.
      - name: Self-test and build
        run: ./gradlew --no-daemon selfTest assembleRelease

      # build.sh calls `aapt` from PATH and signs with launcher/signing/.
      - name: Build the launcher
        run: |
          export PATH="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS:$PATH"
          ./launcher/build.sh

      # Each APK is named for its app's directory (the launcher keeps its old
      # AppDrawer.apk), which is also its name in the release. Then what the
      # Updater app reads: each APK's version and
      # package, from the built APKs themselves, so they can't drift from the
      # build files.
      - name: Collect APKs, versions and packages
        run: |
          mkdir apks
          for apk in */android/app/build/outputs/apk/release/app-release.apk */app/build/outputs/apk/release/app-release.apk; do
            [ -f "$apk" ] && cp "$apk" "apks/${apk%%/*}.apk"
          done
          cp launcher/AppDrawer.apk apks/
          aapt2="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          : > apks/versions.txt
          : > apks/packages.txt
          for apk in apks/*.apk; do
            app=$(basename "$apk" .apk)
            badging=$("$aapt2" dump badging "$apk" | head -n 1)
            version=$(printf '%s\n' "$badging" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
            package=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            if [ -z "$version" ] || [ -z "$package" ]; then
              echo "No version or package in $apk: $badging" >&2
              exit 1
            fi
            echo "$app = $version" >> apks/versions.txt
            echo "$app = $package" >> apks/packages.txt
          done
          cat apks/versions.txt apks/packages.txt

      - uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: apks/
          if-no-files-found: error

      # Pushes to master also publish the APKs to the rolling "latest" release.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          cat > notes.md <<'EOF'
          Built automatically from master. Download the APK for the app you want and install it with `adb install <file>.apk`, or let the Updater app on the phone do it.

          `versions.txt` lists each app's latest version and `packages.txt` its package name; the Updater reads both.
          EOF
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Sonim apps (latest)" --notes-file notes.md
          gh release edit latest --notes-file notes.md
          gh release upload latest apks/*.apk apks/versions.txt apks/packages.txt --clobber
          # Drop assets no build produces any more, such as the old
          # *-debug.apk files.
          gh release view latest --json assets -q '.assets[].name' | while read -r name; do
            [ -f "apks/$name" ] || gh release delete-asset latest "$name" -y
          done
