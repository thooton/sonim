name: Build APKs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.1

jobs:
  gradle:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: books
            dir: books/android
          - app: canvas
            dir: canvas/android
          - app: charge
            dir: charge/android
          - app: delta
            dir: delta/android
          - app: dictionary
            dir: dictionary
          - app: flashcards
            dir: flashcards/android
          - app: list
            dir: list/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - uses: gradle/actions/setup-gradle@v4

      # Charge refuses to build without android/.tokens.json. CI never bakes a
      # real Tesla credential into a downloadable artifact, so it gets a
      # placeholder: the APK builds, but has no working login.
      - name: Placeholder Charge token
        if: matrix.app == 'charge'
        run: echo '{"refreshToken":"ci-placeholder"}' > charge/android/.tokens.json

      # Delta's protocol, store and command-center client are plain Java with
      # their own runner. CI has no logins, so the APK it builds carries none.
      - name: Delta self-test
        if: matrix.app == 'delta'
        working-directory: ${{ matrix.dir }}
        run: ./gradlew --no-daemon :core:selfTest

      # Release builds are signed with the shared key in signing/, the same
      # one the copies on the phone carry, so they install over them.
      - name: Build release APK
        working-directory: ${{ matrix.dir }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp ${{ matrix.dir }}/app/build/outputs/apk/release/app-release.apk out/${{ matrix.app }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: out/*.apk
          if-no-files-found: error

  launcher:
    name: launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      # build.sh calls `aapt` from PATH and signs with launcher/signing/.
      - name: Build AppDrawer APK
        run: |
          export PATH="$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS:$PATH"
          ./launcher/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: launcher/AppDrawer.apk
          if-no-files-found: error

  bundle:
    name: All APKs
    needs: [gradle, launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-apk'
          path: apks
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: apks/*.apk
          if-no-files-found: error

      # Pushes to master also publish the APKs to the rolling "latest" release.
      - name: Publish to the "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          cat > notes.md <<'EOF'
          Built automatically from master. Download the APK for the app you want and install it with `adb install <file>.apk`.
          EOF
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Sonim apps (latest)" --notes-file notes.md
          gh release edit latest --notes-file notes.md
          gh release upload latest apks/*.apk --clobber
          # Drop assets no build produces any more, such as the old
          # *-debug.apk files.
          gh release view latest --json assets -q '.assets[].name' | while read -r name; do
            [ -f "apks/$name" ] || gh release delete-asset latest "$name" -y
          done
