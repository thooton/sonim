plugins {
    id "com.android.application"
}

android {
    namespace "com.hello.xp3"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.hello.xp3"
        minSdk 27
        targetSdk 27
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Signed with the shared key, like every other app here.
apply from: rootProject.file("../../signing/signing.gradle")
