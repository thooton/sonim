plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

apply from: rootProject.file("gradle/bundled.gradle")

// The same command center as Delta, with the same token.
bundled("com.source.xp3") {
    def center = deltaCenter(true)
    [SERVER: center.server, TOKEN: center.token, REVISION: center.revision]
}

android {
    namespace "com.source.xp3"

    defaultConfig {
        applicationId "com.source.xp3"
        versionCode 2
        versionName "1.0.1"
    }
}

dependencies {
    implementation project(":source:core")
    implementation project(":common:ui")
}
