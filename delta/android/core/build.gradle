plugins {
    id "java-library"
}

// No dependencies block, and none is coming: this module is the half of the app
// that has to be plain Java, so that the session protocol and the transcript
// built from it can be run and checked on a desktop JVM.
//
// `release = 8` is the guard that makes that promise mean something. Everything
// here also has to run unchanged on Android at API 27, and the compiler is the
// only thing that reliably notices when a port from a Java 17 desktop program
// reaches for an API the phone does not have: List.of, String.isBlank,
// java.net.http and the rest all fail the build here rather than at the first
// launch on a handset.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 8
}

// A plain Java test runner, kept for the same reason: a test framework would
// be the first third-party dependency in a tree that has none, and the tests
// here need nothing a framework provides.
tasks.register("selfTest", JavaExec) {
    dependsOn "testClasses"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.delta.xp3.SelfTest"
}
tasks.named("check") { dependsOn "selfTest" }
tasks.named("test") {
    dependsOn "selfTest"
    enabled = false // The runner above replaces framework discovery.
}
