plugins {
    id "com.android.application"
}

apply from: rootProject.file("gradle/app.gradle")

apply from: rootProject.file("gradle/bundled.gradle")

// The command center, which the app signs in to and fetches the cloud logins
// from (they are not in the APK at all). Anything holding a build with it can
// run code on the command center and spend the cloud subscriptions.
bundled("com.delta.xp3") {
    // Not from the environment: a build in an agent's sandbox carries no login.
    def center = deltaCenter(false)
    [SERVER: center.server, TOKEN: center.token, REVISION: center.revision]
}

android {
    namespace "com.delta.xp3"

    defaultConfig {
        applicationId "com.delta.xp3"
        versionCode 10
        versionName "1.1.4"
    }
}

dependencies {
    implementation project(":delta:core")
    implementation project(":common:ui")
}
